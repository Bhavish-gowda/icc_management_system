<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — ICC Cricket Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrapper">
  <!-- Left Side: Branding -->
  <div class="auth-side-brand">
    <div class="particles-overlay"></div>
    <div class="brand-content">
      <div class="brand-icon-box">
        <i class="fas fa-baseball-bat-ball"></i>
      </div>
      <h1 class="animate-in">ICC <span>Cricket</span></h1>
      <div class="brand-tagline animate-in delay-1">Cricket Intelligence Platform</div>
      
      <div class="auth-stats-container animate-in delay-2">
        <div class="auth-stat-mini">
          <span class="stat-val">15+</span>
          <span class="stat-lab">Countries</span>
        </div>
        <div class="auth-stat-mini">
          <span class="stat-val">200+</span>
          <span class="stat-lab">Players</span>
        </div>
        <div class="auth-stat-mini">
          <span class="stat-val">Real-Time</span>
          <span class="stat-lab">Rankings</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-side-form">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Access your cricket analytics dashboard</p>
      </div>

      <form id="loginForm">
        <div class="glass-input-group">
          <label for="loginRole">Login As</label>
          <select id="loginRole" class="glass-input" required>
            <option value="" disabled selected>Select Role</option>
            <option value="Admin">Admin</option>
            <option value="Analyst">Analyst</option>
          </select>
        </div>

        <div class="glass-input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="glass-input" placeholder="name@example.com" required>
        </div>

        <div class="glass-input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="glass-input" placeholder="••••••••" required>
          <i class="fas fa-eye password-toggle" id="togglePassword"></i>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.85rem;">
              Remember me
            </label>
          </div>
          <a href="#" class="small text-accent" onclick="showToast('Password reset link sent to your email', 'info')">Forgot Password?</a>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn">
          <span>Login to Dashboard</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
